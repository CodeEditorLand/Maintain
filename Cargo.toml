[[bin]]
name = "BuildMaintain"
path = "Source/Build.rs"

[[bin]]
name = "Maintain"
path = "Source/Library.rs"

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[dependencies]
clap = { workspace = true }
json5 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
toml_edit = { workspace = true }
env_logger = { workspace = true }
colored = { workspace = true }

[lib]
path = "Source/Library.rs"

[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Maintain"
description = "Maintain 💪🏻"
documentation = "https://Documentation.Maintain.Editor.Land"
edition = "2024"
homepage = "https://Maintain.Editor.Land"
license-file = "LICENSE"
name = "Maintain"
publish = false
repository = "https://github.com/CodeEditorLand/Maintain"
version = "0.0.1"

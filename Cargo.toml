[[bin]]
name = "Maintain"
path = "Source/main.rs"

[[test]]
name = "Eliminate"
path = "tests/Eliminate.rs"

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[dependencies]
clap = { workspace = true }
colored = { workspace = true }
chrono = { workspace = true }
env_logger = { workspace = true }
globset = { workspace = true }
json5 = { workspace = true }
log = { workspace = true }
plist = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = "1"
quote = { workspace = true }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true, features = [
	"full",
	"visit",
	"visit-mut",
	"extra-traits",
] }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
walkdir = { workspace = true }

[lib]
path = "Source/Library.rs"

[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Maintain"
description = "Maintain 💪🏻"
documentation = "https://Documentation.Maintain.Editor.Land"
edition = "2024"
homepage = "https://Maintain.Editor.Land"
license-file = "LICENSE"
name = "Maintain"
publish = false
repository = "https://github.com/CodeEditorLand/Maintain"
version = "0.0.1"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]
